<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财算坊 · 后台管理</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#10b981; --gold:#f59e0b; --danger:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#0f172a,#111827);min-height:100vh;color:var(--text);
  }
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
  h1{font-size:24px;font-weight:800}
  .muted{color:var(--muted)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .btn{
    display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;
    font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card2);
    color:var(--text);cursor:pointer;transition:.2s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);color:#04120b;border-color:var(--accent)}
  .btn-primary:hover{color:#04120b;background:#34d399}
  /* 登录 */
  #login{max-width:380px;margin:80px auto}
  #login h1{margin-bottom:6px}
  #login p{margin-bottom:20px}
  #login input{
    width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--text);font-size:15px;outline:none;margin-bottom:12px;
  }
  #login input:focus{border-color:var(--accent)}
  #login .btn{width:100%;justify-content:center;padding:12px}
  #login .err{color:var(--danger);font-size:13px;margin-top:10px;display:none}
  /* 统计 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  .stat .num{font-size:30px;font-weight:800;color:var(--accent)}
  .stat .lbl{color:var(--muted);font-size:13px;margin-top:4px}
  /* 表格 */
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
  td.ip{font-family:ui-monospace,Consolas,monospace;color:#7dd3fc}
  td.path{max-width:260px;overflow:hidden;text-overflow:ellipsis}
  td.ua{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .ok{background:rgba(16,185,129,.15);color:#34d399}
  .bad{background:rgba(239,68,68,.15);color:#f87171}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  .auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  a.back{color:var(--muted);text-decoration:none;font-size:14px}
  a.back:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="card">
    <h1>🔐 后台管理</h1>
    <p class="muted">输入管理密码查看访问日志</p>
    <input type="password" id="pw" placeholder="管理密码" autocomplete="current-password">
    <button class="btn btn-primary" id="login-btn">登 录</button>
    <div class="err" id="login-err">密码错误，请重试</div>
  </div>

  <div id="dash" hidden>
    <div class="top">
      <div>
        <h1>📊 访问日志后台</h1>
        <div class="muted" style="font-size:13px;margin-top:4px">记录每位访客的 IP、时间、路径与设备信息</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <label class="auto"><input type="checkbox" id="auto" checked> 自动刷新(10s)</label>
        <button class="btn" id="refresh">↻ 刷新</button>
        <button class="btn" id="logout">退出</button>
        <a class="back" href="/">← 返回站点</a>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="st-total">-</div><div class="lbl">总访问量</div></div>
      <div class="stat"><div class="num" id="st-ips">-</div><div class="lbl">独立访客 IP</div></div>
      <div class="stat"><div class="num" id="st-today">-</div><div class="lbl">今日访问</div></div>
      <div class="stat"><div class="num" id="st-cap">-</div><div class="lbl">日志容量上限</div></div>
    </div>

    <div class="card" style="padding:0">
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>时间</th><th>IP</th><th>方法</th><th>路径</th><th>状态</th><th>设备 / 浏览器</th><th>来源</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden>暂无访问记录</div>
    </div>
  </div>

</div>

<script>
const TOKEN_KEY = 'ft_admin_token';

function fmtTime(ts){
  const d = new Date(ts);
  const p = (n)=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
async function makeToken(pw){
  const data = new TextEncoder().encode('finance-tools-admin:' + pw);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function getToken(){ return sessionStorage.getItem(TOKEN_KEY) || ''; }

async function api(path){
  const r = await fetch(path + '?token=' + encodeURIComponent(getToken()));
  return r.json();
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadLogs(){
  const [st, lg] = await Promise.all([api('/api/stats'), api('/api/logs?limit=200')]);
  if(!st.ok){ logout(); return; }
  document.getElementById('st-total').textContent = st.stats.total;
  document.getElementById('st-ips').textContent = st.stats.uniqueIps;
  document.getElementById('st-today').textContent = st.stats.today;
  document.getElementById('st-cap').textContent = st.stats.maxLogs;
  const rows = document.getElementById('rows');
  const empty = document.getElementById('empty');
  if(!lg.logs || !lg.logs.length){ rows.innerHTML=''; empty.hidden=false; return; }
  empty.hidden = true;
  rows.innerHTML = lg.logs.slice().reverse().map(e=>{
    const ok = e.s < 400;
    const method = ['GET','POST','PUT','DELETE','HEAD'].includes(e.m) ? e.m : esc(e.m);
    return '<tr>'+
      '<td class="muted">'+fmtTime(e.t)+'</td>'+
      '<td class="ip">'+esc(e.ip)+'</td>'+
      '<td>'+method+'</td>'+
      '<td class="path" title="'+esc(e.p)+'">'+esc(e.p)+'</td>'+
      '<td><span class="badge '+(ok?'ok':'bad')+'">'+e.s+'</span></td>'+
      '<td class="ua" title="'+esc(e.ua)+'">'+esc(e.ua)+'</td>'+
      '<td class="muted">'+(e.ref ? '<span title="'+esc(e.ref)+'">'+esc(e.ref.slice(0,40))+'</span>' : '-')+'</td>'+
      '</tr>';
  }).join('');
}

function logout(){
  sessionStorage.removeItem(TOKEN_KEY);
  document.getElementById('login').hidden = false;
  document.getElementById('dash').hidden = true;
}

document.getElementById('login-btn').addEventListener('click', async ()=>{
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  const token = await makeToken(pw);
  sessionStorage.setItem(TOKEN_KEY, token);
  const st = await api('/api/stats');
  if(st.ok){
    document.getElementById('login').hidden = true;
    document.getElementById('dash').hidden = false;
    loadLogs();
  }else{
    sessionStorage.removeItem(TOKEN_KEY);
    err.style.display = 'block';
  }
});
document.getElementById('pw').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('login-btn').click();
});
document.getElementById('refresh').addEventListener('click', loadLogs);
document.getElementById('logout').addEventListener('click', logout);

// 若已登录直接进入
(async ()=>{
  if(getToken()){
    const st = await api('/api/stats');
    if(st.ok){
      document.getElementById('login').hidden = true;
      document.getElementById('dash').hidden = false;
      loadLogs();
    }else{
      sessionStorage.removeItem(TOKEN_KEY);
    }
  }
})();

setInterval(()=>{
  if(document.getElementById('auto').checked && !document.getElementById('dash').hidden){
    loadLogs();
  }
}, 10000);
</script>
</body>
</html>
